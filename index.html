<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Habit Tracker</title>
  <link id="dynamicGoogleFont" rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IM+Fell+DW+Pica:ital@0;1&display=swap">
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="widget">
    <header class="widget-header">
      <div>
        <h1 id="widgetTitle">DAILY 🔥</h1>
        <p id="dateRange"></p>
      </div>
      <button class="icon-button" id="settingsButton" title="Settings">⚙</button>
    </header>

    <section class="week-navigation">
      <button id="prevWeek">‹</button>
      <button id="todayWeek">Today</button>
      <button id="nextWeek">›</button>
    </section>

    <section class="tracker">
      <div class="grid-header">
        <div></div>
        <div class="days" id="daysHeader"></div>
      </div>
      <div id="habitsGrid"></div>
    </section>
  </main>

  <dialog id="settingsDialog">
    <div class="settings-panel">
      <div class="settings-header">
        <h2>Settings</h2>
        <button type="button" id="closeSettings" class="icon-button">×</button>
      </div>

      <div class="settings-tabs">
        <button class="tab active" data-tab="habits">Habits</button>
        <button class="tab" data-tab="appearance">Appearance</button>
      </div>

      <section class="tab-content active" id="habitsTab">
        <label>Widget title<input id="titleInput" type="text"></label>
        <div class="settings-section-title">
          <h3>Habits</h3>
          <button type="button" id="addHabit">+ Add habit</button>
        </div>
        <div id="habitEditor"></div>
      </section>

      <section class="tab-content" id="appearanceTab">
        <h3 class="appearance-heading">Colors</h3>
        <div id="colorControls" class="color-controls"></div>

        <h3 class="appearance-heading">Typography</h3>
        <div class="font-picker">
          <label>Font family</label>
          <input id="fontSearch" type="search" placeholder="Search Google Fonts..." autocomplete="off">
          <div id="fontStatus" class="font-status">Type a font name to search.</div>
          <div id="fontResults" class="font-results"></div>
          <div class="font-preview" id="fontPreview">The quick brown fox jumps over the lazy dog.</div>
        </div>

        <label>Font style
          <select id="fontStyleInput">
            <option value="italic">Italic</option>
            <option value="normal">Normal</option>
          </select>
        </label>

        <label>Habit font size <span id="fontSizeValue"></span>
          <input type="range" id="fontSizeInput" min="10" max="22" step="1">
        </label>

        <h3 class="appearance-heading">Shape & spacing</h3>
        <label>Widget corner radius <span id="radiusValue"></span>
          <input type="range" id="radiusInput" min="0" max="40" step="1">
        </label>

        <label>Checkbox corner radius <span id="cellRadiusValue"></span>
          <input type="range" id="cellRadiusInput" min="0" max="24" step="1">
        </label>

        <label>Grid spacing <span id="gapValue"></span>
          <input type="range" id="gapInput" min="0" max="20" step="1">
        </label>
      </section>

      <div class="settings-actions">
        <button type="button" id="resetCurrentWeek" class="secondary">Reset week</button>
        <div>
          <button type="button" id="resetAppearance" class="secondary">Reset appearance</button>
          <button type="button" id="saveSettings" class="primary">Save changes</button>
        </div>
      </div>
    </div>
  </dialog>

  <!-- Custom color picker -->
  <dialog id="colorDialog">
    <div class="color-panel">
      <div class="settings-header">
        <h2 id="colorDialogTitle">Choose color</h2>
        <button type="button" id="closeColorPicker" class="icon-button">×</button>
      </div>

      <div class="picker-layout">
        <div>
          <div id="colorSquare" class="color-square">
            <div id="colorSquareCursor" class="color-square-cursor"></div>
          </div>
          <input id="hueSlider" class="hue-slider" type="range" min="0" max="360" value="0">
        </div>
        <div class="color-preview" id="colorPreview"></div>
      </div>

      <div class="color-values">
        <label>H<input id="hInput" type="number" min="0" max="360"></label>
        <label>S<input id="sInput" type="number" min="0" max="100"></label>
        <label>B<input id="bInput" type="number" min="0" max="100"></label>
      </div>

      <div class="color-values">
        <label>R<input id="rInput" type="number" min="0" max="255"></label>
        <label>G<input id="gInput" type="number" min="0" max="255"></label>
        <label>B<input id="bRgbInput" type="number" min="0" max="255"></label>
      </div>

      <label>HEX<input id="hexInput" type="text" maxlength="7"></label>
      <div class="settings-actions">
        <span></span>
        <div>
          <button type="button" id="cancelColor" class="secondary">Cancel</button>
          <button type="button" id="applyColor" class="primary">Apply color</button>
        </div>
      </div>
    </div>
  </dialog>

  <script src="script.js"></script>
</body>
</html>
